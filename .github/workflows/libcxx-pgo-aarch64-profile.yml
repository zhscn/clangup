name: libcxx-pgo aarch64 instrumented

on:
  workflow_dispatch:

concurrency:
  group: libcxx-pgo-aarch64-instrumented
  cancel-in-progress: false

env:
  CHANNEL_ROOT: channels/libcxx-pgo/22.1.8
  DOWNLOAD_ROOT: https://dl.clangup.dev
  BUILDER_IMAGE: ghcr.io/zhscn/clangup-builder:1
  BOOTSTRAP_CHANNEL: default
  BOOTSTRAP_EXACT: 22.1.8-1

jobs:
  profile:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 480
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/lib/jvm /opt/microsoft || true
          docker image prune -af || true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve channel release
        run: |
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p out/plan
          go run ./cmd/channel-plan "$CHANNEL_ROOT/release.yaml" out/plan/channel-plan.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          with open("out/plan/channel-plan.json", encoding="utf-8") as file:
              source = json.load(file)["source"]
          print(f"SOURCE_URL={source['url']}")
          print(f"SOURCE_SHA256={source['sha256']}")
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare source and build environment
        env:
          TARGET: aarch64-unknown-linux-gnu
        run: bash .github/scripts/prepare-libcxx-pgo-build.sh
      - name: Build instrumented compiler
        run: |
          work="$RUNNER_TEMP/clangup-libcxx-pgo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work" out/unused out/instrumented
          docker run --rm --network none \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --mount type=bind,src="$PWD/out/plan/channel-plan.json",dst=/input/channel-plan.json,readonly \
            --mount type=bind,src="$PWD/.cache/sources/llvm-project.tar.xz",dst=/input/llvm-project.tar.xz,readonly \
            --mount type=bind,src="$PWD/.cache/bootstrap",dst=/opt/clangup-bootstrap,readonly \
            --mount type=bind,src="$work",dst=/build \
            --mount type=bind,src="$PWD/out/unused",dst=/out \
            -e CLANGUP_BUILD_COMMIT="$GITHUB_SHA" \
            -e CLANGUP_BUILD_ENVIRONMENT_IDENTITY \
            -e CLANGUP_BOOTSTRAP_KIND=channel-artifact \
            -e CLANGUP_BOOTSTRAP_IDENTITY \
            "$CLANGUP_CONTAINER_IMAGE" \
            python3 /workspace/channels/build/run.py \
              --plan /input/channel-plan.json --target aarch64-unknown-linux-gnu \
              --source /input/llvm-project.tar.xz --channel-root "/workspace/$CHANNEL_ROOT" \
              --config-dir "/workspace/$CHANNEL_ROOT/build" --work /build/work --output /out \
              --jobs "$(nproc)" --link-jobs 2 --source-date-epoch "$(git log -1 --format=%ct)" \
              --stop-after instrumented
          tar --sort=name --owner=0 --group=0 --numeric-owner --use-compress-program='zstd -T4 -19' \
            -C "$work/work" -cf out/instrumented/instrumented-prefix.tar.zst instrumented-prefix
          cp out/plan/channel-plan.json out/instrumented/channel-plan.json
          printf '%s\n' "$GITHUB_SHA" > out/instrumented/build-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcxx-pgo-aarch64-instrumented
          path: out/instrumented/
          if-no-files-found: error
          retention-days: 14
