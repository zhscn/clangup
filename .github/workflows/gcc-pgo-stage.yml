name: GCC PGO stage

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      seed:
        type: string
        required: true
      previous:
        type: string
        default: ''

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            verify_image: quay.io/centos/centos@sha256:e4ca2ed0202e76be184e75fb26d14bf974193579039d5573fb2348664deef76e
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            verify_image: quay.io/centos/centos@sha256:ec16f510e8cd1cceeddc6888fcb37c6d6b7c6863fbc70bdbe660a8ccad4bab6a
          - runner: macos-15
            target: arm64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ matrix.target }}
      VERIFY_IMAGE: ${{ matrix.verify_image }}
      SEED_RELEASE: ${{ inputs.seed }}
      STAGE: ${{ inputs.stage }}
      DOWNLOAD_ROOT: https://dl.clangup.dev
      BUILDER_IMAGE: ghcr.io/zhscn/clangup-builder@sha256:ca2a077d2e00c6d3575b2bbc2c0db746d3a697f06a7155e2a2ebeb80e0cde5f3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - if: inputs.stage == 'profile'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - if: runner.os == 'macOS'
        run: brew install make gmp mpfr libmpc zstd gnu-tar
      - if: runner.os == 'Linux'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.previous != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gcc-pgo-${{ inputs.previous }}-${{ matrix.target }}
          path: out/checkpoint
      - run: bash .github/scripts/gcc-pgo-stage.sh "$STAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcc-pgo-${{ inputs.stage }}-${{ matrix.target }}
          path: out/stage/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
