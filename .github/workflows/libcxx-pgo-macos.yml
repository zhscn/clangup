name: libcxx-pgo macOS

on:
  workflow_dispatch:

concurrency:
  group: libcxx-pgo-macos
  cancel-in-progress: false

env:
  CHANNEL_ROOT: channels/libcxx-pgo/23.1.0

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_url: ${{ steps.plan.outputs.source_url }}
      source_sha256: ${{ steps.plan.outputs.source_sha256 }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve channel release
        run: |
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p out/plan
          go run ./cmd/channel-plan "$CHANNEL_ROOT/release.yaml" out/plan/channel-plan.json
      - name: Export build inputs
        id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("out/plan/channel-plan.json", encoding="utf-8") as file:
              source = json.load(file)["source"]
          print(f"source_url={source['url']}")
          print(f"source_sha256={source['sha256']}")
          PY
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcxx-pgo-macos-plan
          path: out/plan/channel-plan.json
          if-no-files-found: error
          retention-days: 14

  instrumented:
    needs: plan
    runs-on: macos-14
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: brew install cmake ninja zstd gnu-tar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-macos-plan
          path: out/plan
      - name: Download source
        env:
          SOURCE_URL: ${{ needs.plan.outputs.source_url }}
          SOURCE_SHA256: ${{ needs.plan.outputs.source_sha256 }}
        run: |
          mkdir -p .cache/sources
          curl -fsSL -o .cache/sources/llvm-project.tar.xz "$SOURCE_URL"
          echo "$SOURCE_SHA256  .cache/sources/llvm-project.tar.xz" | shasum -a 256 -c -
      - name: Build instrumented compiler
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          bootstrap_identity="$(xcodebuild -version | tr '\n' ' ')"
          work="$RUNNER_TEMP/clangup-libcxx-pgo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work" out/unused out/instrumented
          CLANGUP_BUILD_COMMIT="$GITHUB_SHA" \
          CLANGUP_BUILD_ENVIRONMENT_IDENTITY="$bootstrap_identity" \
          CLANGUP_BOOTSTRAP_KIND=xcode \
          CLANGUP_BOOTSTRAP_IDENTITY="$bootstrap_identity" \
            python3 channels/build/run.py \
              --plan out/plan/channel-plan.json --target arm64-apple-darwin \
              --source .cache/sources/llvm-project.tar.xz --channel-root "$CHANNEL_ROOT" \
              --config-dir "$CHANNEL_ROOT/build" --work "$work/work" --output out/unused \
              --jobs "$(sysctl -n hw.ncpu)" --source-date-epoch "$SOURCE_DATE_EPOCH" \
              --stop-after instrumented
          gtar --sort=name --owner=0 --group=0 --numeric-owner \
            --use-compress-program='zstd -T4 -19' -C "$work/work" \
            -cf out/instrumented/instrumented-prefix.tar.zst instrumented-prefix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcxx-pgo-macos-instrumented
          path: out/instrumented/
          if-no-files-found: error
          retention-days: 14

  profile:
    needs: [plan, instrumented]
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    runs-on: macos-14
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: brew install cmake ninja zstd gnu-tar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-macos-plan
          path: out/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-macos-instrumented
          path: out/instrumented
      - name: Download source
        env:
          SOURCE_URL: ${{ needs.plan.outputs.source_url }}
          SOURCE_SHA256: ${{ needs.plan.outputs.source_sha256 }}
        run: |
          mkdir -p .cache/sources
          curl -fsSL -o .cache/sources/llvm-project.tar.xz "$SOURCE_URL"
          echo "$SOURCE_SHA256  .cache/sources/llvm-project.tar.xz" | shasum -a 256 -c -
      - name: Train ${{ matrix.build_type }} profile
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          bootstrap_identity="$(xcodebuild -version | tr '\n' ' ')"
          work="$RUNNER_TEMP/clangup-libcxx-pgo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          output="out/profile-${{ matrix.build_type }}"
          mkdir -p "$work" out/unused "$output"
          CLANGUP_BUILD_COMMIT="$GITHUB_SHA" \
          CLANGUP_BUILD_ENVIRONMENT_IDENTITY="$bootstrap_identity" \
          CLANGUP_BOOTSTRAP_KIND=xcode \
          CLANGUP_BOOTSTRAP_IDENTITY="$bootstrap_identity" \
            python3 channels/build/run.py \
              --plan out/plan/channel-plan.json --target arm64-apple-darwin \
              --source .cache/sources/llvm-project.tar.xz --channel-root "$CHANNEL_ROOT" \
              --config-dir "$CHANNEL_ROOT/build" --work "$work/work" --output out/unused \
              --jobs "$(sysctl -n hw.ncpu)" --source-date-epoch "$SOURCE_DATE_EPOCH" \
              --start-at train --stop-after merge --train-types "${{ matrix.build_type }}" \
              --instrumented-prefix-archive out/instrumented/instrumented-prefix.tar.zst
          cp "$work/work/pgo/clang.profdata" "$output/clang.profdata"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcxx-pgo-macos-profile-${{ matrix.build_type }}
          path: out/profile-${{ matrix.build_type }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, profile]
    runs-on: macos-14
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: brew install cmake ninja zstd gnu-tar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-macos-plan
          path: out/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-macos-profile-Debug
          path: out/profile-Debug
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-macos-profile-Release
          path: out/profile-Release
      - name: Download source
        env:
          SOURCE_URL: ${{ needs.plan.outputs.source_url }}
          SOURCE_SHA256: ${{ needs.plan.outputs.source_sha256 }}
        run: |
          mkdir -p .cache/sources
          curl -fsSL -o .cache/sources/llvm-project.tar.xz "$SOURCE_URL"
          echo "$SOURCE_SHA256  .cache/sources/llvm-project.tar.xz" | shasum -a 256 -c -
      - name: Build final PGO distribution
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          xcrun llvm-profdata merge -o out/clang.profdata \
            out/profile-Debug/clang.profdata out/profile-Release/clang.profdata
          bootstrap_identity="$(xcodebuild -version | tr '\n' ' ')"
          work="$RUNNER_TEMP/clangup-libcxx-pgo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work" out/arm64-apple-darwin
          CLANGUP_BUILD_COMMIT="$GITHUB_SHA" \
          CLANGUP_BUILD_ENVIRONMENT_IDENTITY="$bootstrap_identity" \
          CLANGUP_BOOTSTRAP_KIND=xcode \
          CLANGUP_BOOTSTRAP_IDENTITY="$bootstrap_identity" \
            python3 channels/build/run.py \
              --plan out/plan/channel-plan.json --target arm64-apple-darwin \
              --source .cache/sources/llvm-project.tar.xz --channel-root "$CHANNEL_ROOT" \
              --config-dir "$CHANNEL_ROOT/build" --work "$work/work" \
              --output out/arm64-apple-darwin --jobs "$(sysctl -n hw.ncpu)" \
              --source-date-epoch "$SOURCE_DATE_EPOCH" --start-at final \
              --profile out/clang.profdata
      - name: Assemble release
        run: python3 channels/build/assemble.py --targets out --output out/release
      - name: Publish release
        env:
          UPLOAD_ENDPOINT: ${{ vars.CLANGUP_UPLOAD_ENDPOINT }}
        run: |
          token="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=clangup-r2-uploader" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python3 channels/build/publish.py --endpoint "$UPLOAD_ENDPOINT" --token "$token" --release out/release/release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcxx-pgo-macos-target
          path: out/arm64-apple-darwin/
          if-no-files-found: error
          retention-days: 14
