name: libcxx-pgo aarch64 final

on:
  workflow_dispatch:
    inputs:
      debug_profile_run_id:
        description: Run ID of the libcxx-pgo aarch64 Debug profile workflow
        required: true
        type: string
      release_profile_run_id:
        description: Run ID of the libcxx-pgo aarch64 Release profile workflow
        required: true
        type: string

concurrency:
  group: libcxx-pgo-aarch64-final
  cancel-in-progress: false

env:
  CHANNEL_ROOT: channels/libcxx-pgo/22.1.8
  DOWNLOAD_ROOT: https://dl.clangup.dev
  BUILDER_IMAGE: ghcr.io/zhscn/clangup-builder:1
  BOOTSTRAP_CHANNEL: default
  BOOTSTRAP_EXACT: 22.1.8-1

jobs:
  final:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 480
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/lib/jvm /opt/microsoft || true
          docker image prune -af || true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-aarch64-profile-debug
          path: input/profile-debug
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.debug_profile_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcxx-pgo-aarch64-profile-release
          path: input/profile-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_profile_run_id }}
      - name: Select upstream commit
        id: upstream
        run: |
          cmp -s input/profile-debug/build-commit.txt input/profile-release/build-commit.txt
          echo "commit=$(cat input/profile-debug/build-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.upstream.outputs.commit }}
          clean: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve and verify channel release
        run: |
          mkdir -p out/plan
          go run ./cmd/channel-plan "$CHANNEL_ROOT/release.yaml" out/plan/channel-plan.json
          cmp -s out/plan/channel-plan.json input/profile-debug/channel-plan.json
          cmp -s out/plan/channel-plan.json input/profile-release/channel-plan.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          with open("out/plan/channel-plan.json", encoding="utf-8") as file:
              source = json.load(file)["source"]
          print(f"SOURCE_URL={source['url']}")
          print(f"SOURCE_SHA256={source['sha256']}")
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare source and build environment
        env:
          TARGET: aarch64-unknown-linux-gnu
        run: bash .github/scripts/prepare-libcxx-pgo-build.sh
      - name: Build final PGO distribution
        run: |
          work="$RUNNER_TEMP/clangup-libcxx-pgo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work" out/aarch64-unknown-linux-gnu
          docker run --rm --network none \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --mount type=bind,src="$PWD/out/plan/channel-plan.json",dst=/input/channel-plan.json,readonly \
            --mount type=bind,src="$PWD/input/profile-debug/clang.profdata",dst=/input/debug.profdata,readonly \
            --mount type=bind,src="$PWD/input/profile-release/clang.profdata",dst=/input/release.profdata,readonly \
            --mount type=bind,src="$PWD/.cache/sources/llvm-project.tar.xz",dst=/input/llvm-project.tar.xz,readonly \
            --mount type=bind,src="$PWD/.cache/bootstrap",dst=/opt/clangup-bootstrap,readonly \
            --mount type=bind,src="$work",dst=/build \
            --mount type=bind,src="$PWD/out/aarch64-unknown-linux-gnu",dst=/out \
            -e CLANGUP_BUILD_COMMIT="$GITHUB_SHA" \
            -e CLANGUP_BUILD_ENVIRONMENT_IDENTITY -e CLANGUP_BOOTSTRAP_KIND=channel-artifact \
            -e CLANGUP_BOOTSTRAP_IDENTITY \
            "$CLANGUP_CONTAINER_IMAGE" \
            python3 /workspace/channels/build/run.py \
              --plan /input/channel-plan.json --target aarch64-unknown-linux-gnu \
              --source /input/llvm-project.tar.xz --channel-root "/workspace/$CHANNEL_ROOT" \
              --config-dir "/workspace/$CHANNEL_ROOT/build" --work /build/work --output /out \
              --jobs "$(nproc)" --link-jobs 2 --source-date-epoch "$(git log -1 --format=%ct)" \
              --start-at final --stop-after final --profile /input/debug.profdata --profile /input/release.profdata
          cp out/plan/channel-plan.json out/aarch64-unknown-linux-gnu/channel-plan.json
          printf '%s\n' "$GITHUB_SHA" > out/aarch64-unknown-linux-gnu/build-commit.txt
      - name: Verify baseline
        run: |
          mkdir -p verify/prefix
          tar --use-compress-program=unzstd -xf out/aarch64-unknown-linux-gnu/toolchain.tar.zst -C verify/prefix
          docker run --rm --network host \
            --mount type=bind,src="$PWD/verify/prefix",dst=/opt/clangup,readonly \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            quay.io/centos/centos:8 bash "/workspace/$CHANNEL_ROOT/build/verify-linux.sh" /opt/clangup el8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcxx-pgo-aarch64-target
          path: out/aarch64-unknown-linux-gnu/
          if-no-files-found: error
          retention-days: 14
