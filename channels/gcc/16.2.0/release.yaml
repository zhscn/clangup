schema: clangup.channel/v1
channel: gcc
version: 16.2.0
release: 1

source:
  url: https://gcc.gnu.org/pub/gcc/releases/gcc-16.2.0/gcc-16.2.0.tar.xz
  sha256: e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e

distribution:
  projects: [gcc]
  runtimes: [libgcc, libstdcxx]

runtime_delivery:
  libgcc:
    linkage: both
  libstdcxx:
    linkage: both

driver:
  libc: system
  cxx_stdlib: libstdc++
  cxx_stdlib_linkage: shared
  linker: system
  rtlib: libgcc
  unwindlib: libgcc

targets:
  - os: linux
    arch: x86_64
    triple: x86_64-unknown-linux-gnu
    libc: glibc
    libc_version: "2.17"
    cpu_isa: x86-64
    driver_requirements: [gnu-linker, glibc-devel]
    required: true

changelog:
  - release: 1
    date: "2026-11-22"
    summary: GCC 16.2 with C and C++ support for x86-64 EL7
