schema: clangup.channel/v1
channel: libcxx-pgo
version: 23.1.0
release: 1

source:
  url: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/llvm-project-23.1.0.src.tar.xz
  sha256: ab1f0e3ec52448c33e8782eaf0422504b87c7b016b22514653ee0d8fcee479ff
  patch_series: patches/series.yaml

distribution:
  projects:
    - bolt
    - clang
    - lld
    - clang-tools-extra
  runtimes:
    - compiler-rt
    - libcxx
    - libcxxabi

runtime_delivery:
  libcxx:
    linkage: static
  libcxxabi:
    linkage: static

driver:
  libc: system
  cxx_stdlib: libc++
  cxx_stdlib_linkage: static
  linker: lld
  rtlib: compiler-rt
  unwindlib: libgcc

targets:
  - os: linux
    arch: x86_64
    triple: x86_64-unknown-linux-gnu
    libc: glibc
    libc_version: "2.17"
    cpu_isa: x86-64-v3
    driver_requirements:
      - gcc-toolchain
      - glibc-devel
    required: true
    optimization:
      pgo: true
      bolt: true

  - os: linux
    arch: aarch64
    triple: aarch64-unknown-linux-gnu
    libc: glibc
    libc_version: "2.28"
    cpu_isa: armv8-a
    driver_requirements:
      - gcc-toolchain
      - glibc-devel
    required: true
    optimization:
      pgo: true
      bolt: false

changelog:
  - release: 1
    date: "2026-08-28"
    summary: Initial LLVM 23.1.0 libcxx-pgo channel contract
